<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width={{ 300 }}, height={{ 450 }}">
    <style>
        @import url('{{ theme.typography.google_fonts_import }}');

        :root {
            /* Background */
            --bg-gradient-start: {{ theme.colors.bg_start }};
            --bg-gradient-mid: {{ theme.colors.bg_mid }};
            --bg-gradient-end: {{ theme.colors.bg_end }};

            /* Primary colors */
            --color-primary: {{ theme.colors.primary }};
            --color-secondary: {{ theme.colors.secondary }};

            /* Text */
            --text-primary: {{ theme.colors.text_primary }};
            --text-secondary: {{ theme.colors.text_secondary }};
            --border-color: {{ theme.colors.border }};

            /* Effects */
            --avatar-glow: {{ theme.colors.effects.avatar_glow }};
            --username-glow: {{ theme.colors.effects.username_glow }};
            --border-gradient-1: {{ theme.colors.effects.border_gradient[0] }};
            --border-gradient-2: {{ theme.colors.effects.border_gradient[1] }};
            --border-gradient-3: {{ theme.colors.effects.border_gradient[2] }};
            --decoration-pink: {{ theme.colors.effects.decoration_pink }};
            --decoration-cyan: {{ theme.colors.effects.decoration_cyan }};

            /* Tier colors */
            --tier-1-start: {{ theme.colors.tier.tier_1[0] }};
            --tier-1-end: {{ theme.colors.tier.tier_1[1] }};
            --tier-2-start: {{ theme.colors.tier.tier_2[0] }};
            --tier-2-end: {{ theme.colors.tier.tier_2[1] }};
            --tier-3-start: {{ theme.colors.tier.tier_3[0] }};
            --tier-3-end: {{ theme.colors.tier.tier_3[1] }};
            --tier-4-start: {{ theme.colors.tier.tier_4[0] }};
            --tier-4-end: {{ theme.colors.tier.tier_4[1] }};
            --tier-5-start: {{ theme.colors.tier.tier_5[0] }};
            --tier-5-end: {{ theme.colors.tier.tier_5[1] }};
            --tier-6-start: {{ theme.colors.tier.tier_6[0] }};
            --tier-6-end: {{ theme.colors.tier.tier_6[1] }};

            /* Tier bar contrast colors */
            --tier-1-contrast: {{ theme.colors.tier_bar_contrast.tier_1 | default('#1a1a2e') }};
            --tier-2-contrast: {{ theme.colors.tier_bar_contrast.tier_2 | default('#1a1a2e') }};
            --tier-3-contrast: {{ theme.colors.tier_bar_contrast.tier_3 | default('#ffffff') }};
            --tier-4-contrast: {{ theme.colors.tier_bar_contrast.tier_4 | default('#1a1a2e') }};
            --tier-5-contrast: {{ theme.colors.tier_bar_contrast.tier_5 | default('#ffffff') }};
            --tier-6-contrast: {{ theme.colors.tier_bar_contrast.tier_6 | default('#1a1a2e') }};

            /* Typography */
            --font-header: '{{ theme.typography.header_font }}', sans-serif;
            --font-body: '{{ theme.typography.body_font }}', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: var(--font-body);
            background: transparent;
        }

        .card {
            width: 300px;
            height: 450px;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        /* Background decoration */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, var(--decoration-pink) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, var(--decoration-cyan) 0%, transparent 50%);
            pointer-events: none;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, var(--border-gradient-1), var(--border-gradient-2), var(--border-gradient-3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Header with avatar and info */
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-secondary), var(--border-gradient-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-header);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 16px var(--avatar-glow);
            background-size: cover;
            background-position: center;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .username {
            font-family: var(--font-header);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
            text-shadow: 0 0 8px var(--username-glow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-badge {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Tier bar */
        .tier-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .tier-gradient {
            flex: 1;
            height: 24px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tier-gradient.tier-1 {
            background: linear-gradient(135deg, var(--tier-1-start), var(--tier-1-end));
            color: var(--tier-1-contrast);
        }
        .tier-gradient.tier-2 {
            background: linear-gradient(135deg, var(--tier-2-start), var(--tier-2-end));
            color: var(--tier-2-contrast);
        }
        .tier-gradient.tier-3 {
            background: linear-gradient(135deg, var(--tier-3-start), var(--tier-3-end));
            color: var(--tier-3-contrast);
        }
        .tier-gradient.tier-4 {
            background: linear-gradient(135deg, var(--tier-4-start), var(--tier-4-end));
            color: var(--tier-4-contrast);
        }
        .tier-gradient.tier-5 {
            background: linear-gradient(135deg, var(--tier-5-start), var(--tier-5-end));
            color: var(--tier-5-contrast);
        }
        .tier-gradient.tier-6 {
            background: linear-gradient(135deg, var(--tier-6-start), var(--tier-6-end));
            color: var(--tier-6-contrast);
        }

        /* Combat Stats Placeholders */
        .combat-stats-container {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .combat-stat {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .combat-icon {
            font-size: 16px;
        }

        .combat-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .combat-value {
            font-family: var(--font-header);
            font-size: 16px;
            font-weight: 900;
            color: var(--text-primary);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            min-height: 20px;
            text-align: center;
        }

        /* HP Progress Bar */
        .hp-bar-container {
            margin-top: auto;
            padding: 8px 0;
            position: relative;
            z-index: 1;
        }

        .hp-bar-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .hp-bar-background {
            width: 100%;
            height: 20px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Header with avatar and user info -->
        <div class="card-header">
            <div class="avatar" {% if user.photo_url %}style="background-image: url('{{ user.photo_url }}')"{% endif %}>
                {% if not user.photo_url %}{{ user.initials }}{% endif %}
            </div>
            <div class="user-info">
                <div class="username">{{ user.first_name }} {{ user.last_name }}</div>
                <div class="rank-badge">#{{ rank }}</div>
            </div>
        </div>

        <!-- Tier bar -->
        <div class="tier-bar">
            <div class="tier-gradient {{ overall.tier_class }}">{{ overall.label }}</div>
        </div>

        <!-- Combat Stats Placeholders -->
        <div class="combat-stats-container">
            <div class="combat-stat">
                <div class="combat-icon">⚔️</div>
                <div class="combat-label">ATK</div>
                <div class="combat-value">--</div>
            </div>
            <div class="combat-stat">
                <div class="combat-icon">🛡️</div>
                <div class="combat-label">DEF</div>
                <div class="combat-value">--</div>
            </div>
            <div class="combat-stat">
                <div class="combat-icon">🥩</div>
                <div class="combat-label">HP</div>
                <div class="combat-value">--</div>
            </div>
        </div>

        <!-- HP Progress Bar Placeholder -->
        <div class="hp-bar-container">
            <div class="hp-bar-label">HP</div>
            <div class="hp-bar-background">
                <div class="hp-bar-fill"></div>
            </div>
        </div>
    </div>
</body>
</html>
