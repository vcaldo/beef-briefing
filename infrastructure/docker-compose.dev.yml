# Development environment - local machine
services:
  postgres:
    build:
      context: ../apps/postgres
      dockerfile: Dockerfile
    container_name: beef-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - beef-dev-network
    restart: unless-stopped

  api-service:
    build:
      context: ../apps/api-service
      dockerfile: Dockerfile
    container_name: beef-api-service-dev
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      API_PORT: ${API_PORT}
      OLLAMA_API_HOST: ollama
      OLLAMA_API_PORT: ${OLLAMA_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      - postgres
    networks:
      - beef-dev-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: beef-minio-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - beef-dev-network
    restart: unless-stopped

volumes:
  postgres_data_dev:
  minio_data_dev:

networks:
  beef-dev-network:
    driver: bridge
