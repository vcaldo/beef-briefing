#cloud-config

# Create admin user with sudo and docker access
users:
  - name: admin
    groups: [sudo, docker]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

# Disable password authentication and root login
ssh_pwauth: false
disable_root: false

# SSH hardening configuration
write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      ChallengeResponseAuthentication no
      UsePAM yes
      AllowUsers admin
      X11Forwarding no
      PrintMotd no
      AcceptEnv LANG LC_*
    permissions: '0644'

# Configure hostname
hostname: ${hostname}
fqdn: ${hostname}.local
preserve_hostname: true

# Package updates and installations
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - wget
  - make
  - vim
  - gunzip

# Commands to run after package installation
runcmd:
  # Set hostname
  - hostnamectl set-hostname ${hostname}
  - hostname ${hostname}
  # Restart SSH to apply hardening configuration
  - systemctl restart sshd
  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  # Install Go 1.25.4
  - wget https://go.dev/dl/go1.25.4.linux-amd64.tar.gz -O /tmp/go1.25.4.linux-amd64.tar.gz
  - tar -C /usr/local -xzf /tmp/go1.25.4.linux-amd64.tar.gz
  - rm /tmp/go1.25.4.linux-amd64.tar.gz
  - echo 'export PATH=$PATH:/usr/local/go/bin' >> /etc/profile
  # Verify installations
  - docker --version
  - docker compose version
  - /usr/local/go/bin/go version
  # Install LazyDocker
  - GOPATH=/usr/local/go /usr/local/go/bin/go install github.com/jesseduffield/lazydocker@latest
  - ln -sf /usr/local/go/bin/lazydocker /usr/local/bin/lazydocker
  # Install New Relic Infrastructure Agent (if license key provided)
  - |
    if [ -n "${new_relic_license_key}" ]; then
      echo "Installing New Relic Infrastructure Agent..."
      curl -Ls https://download.newrelic.com/install/newrelic-cli/scripts/install.sh | bash && sudo NEW_RELIC_API_KEY="${new_relic_license_key}" NEW_RELIC_ACCOUNT_ID="${new_relic_account_id}" NEW_RELIC_REGION="EU" /usr/local/bin/newrelic install -y
    fi
  # Mount block storage for PostgreSQL data
  - |
    echo "Waiting for block storage device to appear..."
    DEVICE_PATH="/dev/disk/by-id/scsi-0Linode_Volume_${block_storage_label}"
    MOUNT_PATH="${block_storage_mount_path}"
    MAX_ATTEMPTS=60
    ATTEMPT=0
    while [ ! -e "$DEVICE_PATH" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
      echo "Waiting for $DEVICE_PATH... (attempt $((ATTEMPT+1))/$MAX_ATTEMPTS)"
      sleep 5
      ATTEMPT=$((ATTEMPT+1))
    done
    if [ ! -e "$DEVICE_PATH" ]; then
      echo "ERROR: Block storage device $DEVICE_PATH did not appear after $MAX_ATTEMPTS attempts"
      exit 1
    fi
    echo "Block storage device found at $DEVICE_PATH"
    # Check if already formatted
    if ! blkid "$DEVICE_PATH" | grep -q 'TYPE='; then
      echo "Formatting block storage with ext4..."
      mkfs.ext4 "$DEVICE_PATH"
    else
      echo "Block storage already formatted, skipping format"
    fi
    # Create mount point and mount
    mkdir -p "$MOUNT_PATH"
    mount "$DEVICE_PATH" "$MOUNT_PATH"
    # Add to fstab for persistence across reboots
    if ! grep -q "$DEVICE_PATH" /etc/fstab; then
      echo "$DEVICE_PATH $MOUNT_PATH ext4 defaults,noatime,nofail 0 2" >> /etc/fstab
      echo "Added block storage to /etc/fstab"
    fi
    # Set ownership for PostgreSQL container (uid/gid 999)
    chown -R 999:999 "$MOUNT_PATH"
    chmod 700 "$MOUNT_PATH"
    echo "Block storage mounted at $MOUNT_PATH and configured for PostgreSQL"
final_message: "Beef Briefing server setup completed. Docker, Docker Compose, and Go 1.25.4 installed. SSH hardened with admin user only. System will restart in 1 minute."
