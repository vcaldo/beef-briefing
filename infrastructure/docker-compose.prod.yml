# Production environment - Linode server
services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: beef-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # PostgreSQL only accessible via internal Docker network (no external port exposure)
    volumes:
      - ${POSTGRES_DATA_PATH:-/mnt/postgres-data}/pgdata:/var/lib/postgresql/data
    networks:
      - beef-prod-network
    restart: unless-stopped

  api-service:
    build:
      context: ..
      dockerfile: apps/api-service/Dockerfile
    image: beef-briefing/api-service:${IMAGE_TAG}
    container_name: beef-api-service-prod
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_SSL_MODE: disable
      API_PORT: ${API_PORT}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_REGION: ${MINIO_REGION}
      APP_KEYS_DIR: /app/secrets/app_keys
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: production
      LOG_LEVEL: info
    volumes:
      - ./secrets/api-service:/app/secrets:ro
    depends_on:
      - postgres
    networks:
      - beef-prod-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-service.rule=Host(`api.${DOMAIN_NAME}`)"
      - "traefik.http.routers.api-service.entrypoints=websecure"
      - "traefik.http.routers.api-service.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-service.loadbalancer.server.port=${API_PORT}"
      - "traefik.http.middlewares.api-ipallow.ipallowlist.sourcerange=${ALLOWED_IP}"
      - "traefik.http.routers.api-service.middlewares=api-ipallow"
    restart: unless-stopped

  telegram-bot:
    build:
      context: ..
      dockerfile: apps/telegram-bot/Dockerfile
    image: beef-briefing/telegram-bot:${IMAGE_TAG}
    container_name: beef-telegram-bot-prod
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_SERVICE_URL: http://api-service:${API_PORT}
      API_KEY_FILE: /app/secrets/api_key
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: production
      LOG_LEVEL: info
    volumes:
      - ./secrets/telegram-bot:/app/secrets:ro
    depends_on:
      - api-service
    networks:
      - beef-prod-network
    restart: unless-stopped

  leaderboard:
    build:
      context: ..
      dockerfile: apps/leaderboard/Dockerfile
    image: beef-briefing/leaderboard:${IMAGE_TAG}
    container_name: beef-leaderboard-prod
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_SSL_MODE: disable
      LEADERBOARD_PORT: 8050
      LEADERBOARD_PATH: ${LEADERBOARD_PATH:-/leaderboard}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      API_SERVICE_URL: http://api-service:${API_PORT}
      API_KEY_FILE: /app/secrets/api_key
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: production
      LOG_LEVEL: info
    volumes:
      - ./secrets/leaderboard:/app/secrets:ro
    depends_on:
      - postgres
      - api-service
    networks:
      - beef-prod-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.leaderboard.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`${LEADERBOARD_PATH:-/leaderboard}`)"
      - "traefik.http.routers.leaderboard.entrypoints=websecure"
      - "traefik.http.routers.leaderboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.leaderboard.loadbalancer.server.port=8050"
      - "traefik.http.middlewares.leaderboard-strip.stripprefix.prefixes=${LEADERBOARD_PATH:-/leaderboard}"
      - "traefik.http.routers.leaderboard.middlewares=leaderboard-strip"
    restart: unless-stopped

  traefik:
    image: traefik:v3.6.4
    container_name: beef-traefik-prod
    command:
      # API Settings
      - "--api.dashboard=true"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=beef-prod-network"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP to HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Optional: Let's Encrypt Staging (for testing - uncomment to use)
      # - "--certificatesresolvers.letsencrypt-staging.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      # - "--certificatesresolvers.letsencrypt-staging.acme.httpchallenge=true"
      # - "--certificatesresolvers.letsencrypt-staging.acme.httpchallenge.entrypoint=web"
      # - "--certificatesresolvers.letsencrypt-staging.acme.email=${LETSENCRYPT_EMAIL}"
      # - "--certificatesresolvers.letsencrypt-staging.acme.storage=/letsencrypt/acme-staging.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - beef-prod-network
    labels:
      # Enable Traefik for this service
      - "traefik.enable=true"
      # Dashboard routing - Traefik API is at /api and dashboard at /dashboard
      - 'traefik.http.routers.traefik-api.rule=Host(`${DOMAIN_NAME}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
      - "traefik.http.routers.traefik-api.entrypoints=websecure"
      - "traefik.http.routers.traefik-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-api.service=api@internal"
      # Dashboard middleware (basic auth only, no strip prefix)
      - "traefik.http.routers.traefik-api.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS}"
    restart: unless-stopped

networks:
  beef-prod-network:
    driver: bridge
