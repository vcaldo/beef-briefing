# Production environment - Linode server
services:
  postgres:
    build:
      context: ../apps/postgres
      dockerfile: Dockerfile
    image: beef-briefing/postgres:${IMAGE_TAG}
    container_name: beef-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - beef-prod-network
    restart: unless-stopped

  api-service:
    build:
      context: ..
      dockerfile: apps/api-service/Dockerfile
    image: beef-briefing/api-service:${IMAGE_TAG}
    container_name: beef-api-service-prod
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_SSL_MODE: disable
      API_PORT: ${API_PORT}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: telegram-media
      MINIO_USE_SSL: false
      ENVIRONMENT: production
      LOG_LEVEL: info
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      - postgres
      - minio
    networks:
      - beef-prod-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: beef-minio-prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_prod:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - beef-prod-network
    restart: unless-stopped

  telegram-bot:
    build:
      context: ..
      dockerfile: apps/telegram-bot/Dockerfile
    image: beef-briefing/telegram-bot:${IMAGE_TAG}
    container_name: beef-telegram-bot-prod
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_SERVICE_URL: http://api-service:${API_PORT}
      ENVIRONMENT: production
      LOG_LEVEL: info
    depends_on:
      - api-service
    networks:
      - beef-prod-network
    restart: unless-stopped

  admin-panel:
    build:
      context: ..
      dockerfile: apps/admin-panel/Dockerfile
    image: beef-briefing/admin-panel:${IMAGE_TAG}
    container_name: beef-admin-panel-prod
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_SSL_MODE: disable
      ADMIN_PANEL_PORT: ${ADMIN_PANEL_PORT:-8081}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH_FILE: ${ADMIN_PASSWORD_HASH_FILE}
      SESSION_SECRET_FILE: ${SESSION_SECRET_FILE}
      ENVIRONMENT: production
      LOG_LEVEL: info
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "${ADMIN_PANEL_PORT:-8081}:${ADMIN_PANEL_PORT:-8081}"
    depends_on:
      - postgres
    networks:
      - beef-prod-network
    restart: unless-stopped

volumes:
  postgres_data_prod:
  minio_data_prod:

networks:
  beef-prod-network:
    driver: bridge
