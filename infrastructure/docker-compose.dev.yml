# Development environment - local machine
services:
  postgres:
    build:
      context: ../apps/postgres
      dockerfile: Dockerfile
    container_name: beef-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - beef-dev-network
    restart: unless-stopped

  api-service:
    build:
      context: ..
      dockerfile: apps/api-service/Dockerfile
    container_name: beef-api-service-dev
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_SSL_MODE: disable
      API_PORT: ${API_PORT}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: telegram-media
      MINIO_USE_SSL: false
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      - postgres
      - minio
    networks:
      - beef-dev-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: beef-minio-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - beef-dev-network
    restart: unless-stopped

  telegram-bot:
    build:
      context: ..
      dockerfile: apps/telegram-bot/Dockerfile
    container_name: beef-telegram-bot-dev
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_SERVICE_URL: http://api-service:${API_PORT}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    depends_on:
      - api-service
    networks:
      - beef-dev-network
    restart: unless-stopped

  admin-panel:
    build:
      context: ..
      dockerfile: apps/admin-panel/Dockerfile
    container_name: beef-admin-panel-dev
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_SSL_MODE: disable
      ADMIN_PANEL_PORT: ${ADMIN_PANEL_PORT:-8081}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH_FILE: ${ADMIN_PASSWORD_HASH_FILE}
      SESSION_SECRET_FILE: ${SESSION_SECRET_FILE}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "${ADMIN_PANEL_PORT:-8081}:${ADMIN_PANEL_PORT:-8081}"
    depends_on:
      - postgres
    networks:
      - beef-dev-network
    restart: unless-stopped

  postgres-export:
    image: postgis/postgis:17-3.4
    container_name: beef-postgres-export-dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_export_dev:/var/lib/postgresql/data
      - ../local_import/backup_20251208_111119.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    networks:
      - beef-dev-network
    restart: unless-stopped

volumes:
  postgres_data_dev:
  postgres_data_export_dev:
  minio_data_dev:

networks:
  beef-dev-network:
    driver: bridge
