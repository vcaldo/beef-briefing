server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Block common scanner probes - return 404 for sensitive paths
    location ~ /\. {
        return 404;
    }
    location ~ ^/(\.env|\.git|\.svn|\.hg|\.DS_Store|config\.json|server-status|debug|telescope|_all_dbs|v2/_catalog|wp-|login\.action|info\.php|ecp/) {
        return 404;
    }

    # Empty favicon to suppress errors (or replace with actual favicon)
    location = /favicon.ico {
        return 204;
        access_log off;
    }

    # Handle SPA routing - all paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Don't cache HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
