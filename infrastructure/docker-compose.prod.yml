# Production environment - Linode server
services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: beef-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # PostgreSQL only accessible via internal Docker network (no external port exposure)
    volumes:
      - ${POSTGRES_DATA_PATH:-/mnt/postgres-data}/pgdata:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - beef-prod-network
    restart: unless-stopped

  api-service:
    build:
      context: ..
      dockerfile: apps/api-service/Dockerfile
    image: beef-briefing/api-service:${IMAGE_TAG}
    container_name: beef-api-service-prod
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_SSL_MODE: disable
      API_PORT: ${API_PORT}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      ENVIRONMENT: production
      LOG_LEVEL: info
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      - postgres
    networks:
      - beef-prod-network
    restart: unless-stopped

  telegram-bot:
    build:
      context: ..
      dockerfile: apps/telegram-bot/Dockerfile
    image: beef-briefing/telegram-bot:${IMAGE_TAG}
    container_name: beef-telegram-bot-prod
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_SERVICE_URL: http://api-service:${API_PORT}
      ENVIRONMENT: production
      LOG_LEVEL: info
    depends_on:
      - api-service
    networks:
      - beef-prod-network
    restart: unless-stopped

  admin-panel:
    build:
      context: ..
      dockerfile: apps/admin-panel/Dockerfile
    image: beef-briefing/admin-panel:${IMAGE_TAG}
    container_name: beef-admin-panel-prod
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_SSL_MODE: disable
      ADMIN_PANEL_PORT: ${ADMIN_PANEL_PORT:-8081}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH_FILE: ${ADMIN_PASSWORD_HASH_FILE}
      SESSION_SECRET_FILE: ${SESSION_SECRET_FILE}
      SECURE_COOKIES: false
      ENVIRONMENT: production
      LOG_LEVEL: info
    volumes:
      - ./secrets/admin-panel:/app/secrets:ro
    ports:
      - "${ADMIN_PANEL_PORT:-8081}:${ADMIN_PANEL_PORT:-8081}"
    depends_on:
      - postgres
    networks:
      - beef-prod-network
    restart: unless-stopped

  newrelic-infra:
    image: newrelic/infrastructure:latest
    container_name: beef-newrelic-infra-prod
    cap_add:
      - SYS_PTRACE
    network_mode: bridge
    pid: host
    privileged: true
    volumes:
      - "/:/host:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./secrets/new-relic/newrelic-infra.yml:/etc/newrelic-infra.yml:ro"
    restart: unless-stopped

networks:
  beef-prod-network:
    driver: bridge
