# Development environment - local machine
services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: beef-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      # To restore a backup on dev environment startup, run: make clean
      # then uncomment the line below and run: make up
      - ../local_backups/db/latest.sql:/docker-entrypoint-initdb.d/99-restore.sql:ro
    networks:
      - beef-dev-network
    restart: unless-stopped

  api-service:
    build:
      context: ..
      dockerfile: apps/api-service/Dockerfile
    container_name: beef-api-service-dev
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL_MODE: disable
      API_PORT: ${API_PORT}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: telegram-media
      MINIO_USE_SSL: false
      MINIO_REGION: ${MINIO_REGION:-}
      APP_KEYS_DIR: /app/secrets/app_keys
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./secrets/apps/api-service:/app/secrets:ro
    depends_on:
      - postgres
      - minio
    networks:
      - beef-dev-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: beef-minio-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - beef-dev-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: beef-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data_dev:/qdrant/storage
    networks:
      - beef-dev-network
    restart: unless-stopped

  telegram-bot:
    build:
      context: ..
      dockerfile: apps/telegram-bot/Dockerfile
    container_name: beef-telegram-bot-dev
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_SERVICE_URL: http://api-service:${API_PORT}
      API_KEY_FILE: /app/secrets/api_key
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    volumes:
      - ./secrets/apps/telegram-bot:/app/secrets:ro
    depends_on:
      - api-service
    networks:
      - beef-dev-network
    restart: unless-stopped

  leaderboard:
    build:
      context: ..
      dockerfile: apps/leaderboard/Dockerfile
    container_name: beef-leaderboard-dev
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL_MODE: disable
      LEADERBOARD_PORT: ${LEADERBOARD_PORT:-8050}
      LEADERBOARD_PATH: ${LEADERBOARD_PATH:-/leaderboard}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      API_SERVICE_URL: http://api-service:${API_PORT}
      API_KEY_FILE: /app/secrets/api_key
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "${LEADERBOARD_PORT:-8050}:8050"
    volumes:
      - ./secrets/apps/leaderboard:/app/secrets:ro
    depends_on:
      - postgres
      - api-service
    networks:
      - beef-dev-network
    restart: unless-stopped

  ml-dashboard:
    build:
      context: ..
      dockerfile: apps/ml-dashboard/Dockerfile
    container_name: beef-ml-dashboard-dev
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL_MODE: disable
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      ML_DASHBOARD_PORT: ${ML_DASHBOARD_PORT:-8501}
      ENVIRONMENT: development
      LOG_LEVEL: debug
      CACHE_DIR: /app/cache
    ports:
      - "${ML_DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ml_dashboard_cache_dev:/app/cache
    depends_on:
      - postgres
    networks:
      - beef-dev-network
  ml-processor:
    build:
      context: ..
      dockerfile: apps/ml-processor/Dockerfile
    container_name: beef-ml-processor-dev
    command: ["python", "main.py", "process", "--chat-id", "-1002572302334"]
    environment:
      # Database (direct PostgreSQL access)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL_MODE: disable
      # Provider selection (local, openai, anthropic, perspective)
      SENTIMENT_PROVIDER: ${SENTIMENT_PROVIDER:-local}
      TOXICITY_PROVIDER: ${TOXICITY_PROVIDER:-local}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-local}
      TOPICS_PROVIDER: ${TOPICS_PROVIDER:-local}
      NER_PROVIDER: ${NER_PROVIDER:-local}
      HUMOR_PROVIDER: ${HUMOR_PROVIDER:-local}
      QUESTIONS_PROVIDER: ${QUESTIONS_PROVIDER:-local}
      # API keys (for non-local providers)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PERSPECTIVE_API_KEY: ${PERSPECTIVE_API_KEY:-}
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # Processing
      BATCH_SIZE: ${ML_BATCH_SIZE:-500}
      SLEEP_SECONDS: ${ML_SLEEP_SECONDS:-60}
      DEVICE: ${ML_DEVICE:-cuda}
      # Application
      ENVIRONMENT: development
      LOG_LEVEL: debug
    volumes:
      - ml_models_cache_dev:/root/.cache/huggingface
    depends_on:
      - postgres
      - qdrant
    networks:
      - beef-dev-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data_dev:
  minio_data_dev:
  qdrant_data_dev:
  ml_dashboard_cache_dev:
  ml_models_cache_dev:

networks:
  beef-dev-network:
    driver: bridge
