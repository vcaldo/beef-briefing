# Development environment - local machine
services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: beef-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      # To restore a backup on dev environment startup, run: make clean
      # then uncomment the line below and run: make up
      # - ../local_backups/db/latest.sql:/docker-entrypoint-initdb.d/99-restore.sql:ro
    networks:
      - beef-dev-network
    restart: unless-stopped

  api-service:
    build:
      context: ..
      dockerfile: apps/api-service/Dockerfile
    container_name: beef-api-service-dev
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL_MODE: disable
      API_PORT: ${API_PORT}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: telegram-media
      MINIO_USE_SSL: false
      MINIO_REGION: ${MINIO_REGION:-}
      APP_KEYS_DIR: /app/secrets/app_keys
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: debug
      # Mini App authentication
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: http://localhost:5174,http://localhost:6175
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./secrets/apps/api-service:/app/secrets:ro
    depends_on:
      - postgres
      - minio
    networks:
      - beef-dev-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: beef-minio-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - beef-dev-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: beef-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data_dev:/qdrant/storage
    networks:
      - beef-dev-network
    restart: unless-stopped

  telegram-bot:
    build:
      context: ..
      dockerfile: apps/telegram-bot/Dockerfile
    container_name: beef-telegram-bot-dev
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      API_SERVICE_URL: http://api-service:${API_PORT}
      API_KEY_FILE: /app/secrets/api_key
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    volumes:
      - ./secrets/apps/telegram-bot:/app/secrets:ro
    depends_on:
      - api-service
    networks:
      - beef-dev-network
    restart: unless-stopped

  ml-processor:
    build:
      context: ..
      dockerfile: apps/ml-processor/Dockerfile
    container_name: beef-ml-processor-dev
    # Idle container - use make ml-* targets to run commands
    command: ["sleep", "infinity"]
    environment:
      # Database - DEV (local postgres container) - DEFAULT
      # Use make ml-*-prod targets to connect to production via SSH tunnel
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL_MODE: disable
      # Provider selection (local, openai, anthropic, perspective)
      SENTIMENT_PROVIDER: ${SENTIMENT_PROVIDER:-local}
      TOXICITY_PROVIDER: ${TOXICITY_PROVIDER:-local}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-local}
      TOPICS_PROVIDER: ${TOPICS_PROVIDER:-local}
      NER_PROVIDER: ${NER_PROVIDER:-local}
      HUMOR_PROVIDER: ${HUMOR_PROVIDER:-local}
      QUESTIONS_PROVIDER: ${QUESTIONS_PROVIDER:-local}
      # API keys (for non-local providers)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PERSPECTIVE_API_KEY: ${PERSPECTIVE_API_KEY:-}
      # OpenAI Rate Limiting (Tier 1 defaults)
      OPENAI_RATE_LIMIT_ENABLED: ${OPENAI_RATE_LIMIT_ENABLED:-true}
      OPENAI_RATE_LIMIT_TIMEOUT: ${OPENAI_RATE_LIMIT_TIMEOUT:-120.0}
      OPENAI_GPT4O_MINI_TPM: ${OPENAI_GPT4O_MINI_TPM:-200000}
      OPENAI_GPT4O_MINI_RPM: ${OPENAI_GPT4O_MINI_RPM:-500}
      OPENAI_EMBEDDING_TPM: ${OPENAI_EMBEDDING_TPM:-1000000}
      OPENAI_EMBEDDING_RPM: ${OPENAI_EMBEDDING_RPM:-3000}
      OPENAI_MODERATION_TPM: ${OPENAI_MODERATION_TPM:-10000}
      OPENAI_MODERATION_RPM: ${OPENAI_MODERATION_RPM:-500}
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # Processing
      BATCH_SIZE: ${ML_BATCH_SIZE:-500}
      SLEEP_SECONDS: ${ML_SLEEP_SECONDS:-60}
      DEVICE: ${ML_DEVICE:-cuda}
      # Application
      ENVIRONMENT: development
      LOG_LEVEL: debug
      # New Relic APM
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_AI_MONITORING_ENABLED: "true"
      TRACK_AI_COSTS: "true"
      # Card Image Generator (for render-cards command)
      CARD_RENDERER_URL: http://card-renderer:8051
      CARD_RENDERER_API_KEY_FILE: /app/secrets/card_renderer_api_key
      DEFAULT_CARD_THEME: ${DEFAULT_CARD_THEME:-gaming}
      # Tier Configuration (same as card-renderer)
      TIER_1: ${TIER_1:-Legendary:85}
      TIER_2: ${TIER_2:-Elite:70}
      TIER_3: ${TIER_3:-Outstanding:55}
      TIER_4: ${TIER_4:-Regular:40}
      TIER_5: ${TIER_5:-Beginner:25}
      TIER_6: ${TIER_6:-Rookie:0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ml_models_cache_dev:/root/.cache/huggingface
      - ./secrets/apps/ml-processor:/app/secrets:ro
    depends_on:
      - postgres
      - qdrant
      - card-renderer
    networks:
      - beef-dev-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  card-renderer:
    build:
      context: ..
      dockerfile: apps/card-renderer/Dockerfile
    container_name: beef-card-renderer-dev
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL_MODE: disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: telegram-media
      MINIO_USE_SSL: false
      CARD_RENDERER_PORT: 8051
      TEMPLATES_DIR: /app/templates
      APP_KEYS_DIR: /app/secrets/app_keys
      ENVIRONMENT: development
      LOG_LEVEL: debug
      # New Relic APM (optional)
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      TIER_1: ${TIER_1:-Legendary:85}
      TIER_2: ${TIER_2:-Elite:70}
      TIER_3: ${TIER_3:-Outstanding:55}
      TIER_4: ${TIER_4:-Regular:40}
      TIER_5: ${TIER_5:-Beginner:25}
      TIER_6: ${TIER_6:-Rookie:0}
      # Mini App authentication
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:6175
    ports:
      - "8051:8051"
    volumes:
      - ./secrets/apps/card-renderer:/app/secrets:ro
    depends_on:
      - postgres
      - minio
    networks:
      - beef-dev-network
    restart: unless-stopped

  # Deck Mini App - Development with hot reload
  # Note: For development, run manually with npm outside Docker for best DX
  # or use this container for consistency with production
  deck-mini-app-dev:
    image: node:22-alpine
    container_name: beef-deck-mini-app-dev
    working_dir: /workspace/apps/deck-mini-app
    volumes:
      - ..:/workspace
      - deck_mini_app_node_modules_dev:/workspace/apps/deck-mini-app/node_modules
      - shared_mini_app_node_modules_dev:/workspace/apps/shared-mini-app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install -g pnpm && cd /workspace && pnpm install --filter @beef-briefing/deck-mini-app... && cd apps/deck-mini-app && pnpm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8080
      # New Relic Browser monitoring (optional)
      VITE_NEW_RELIC_BROWSER_ACCOUNT_ID: ${NEW_RELIC_ACCOUNT_ID:-}
      VITE_NEW_RELIC_BROWSER_APP_ID: ${NEW_RELIC_BROWSER_APP_ID:-}
      VITE_NEW_RELIC_BROWSER_LICENSE_KEY: ${NEW_RELIC_BROWSER_LICENSE_KEY:-}
      VITE_ENVIRONMENT: development
    networks:
      - beef-dev-network

  # Leaderboard Mini App - Development with hot reload
  leaderboard-mini-app-dev:
    image: node:22-alpine
    container_name: beef-leaderboard-mini-app-dev
    working_dir: /app
    volumes:
      - ../apps/leaderboard-mini-app:/app
      - leaderboard_mini_app_node_modules_dev:/app/node_modules
    ports:
      - "5174:5174"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8080
      # New Relic Browser monitoring (optional)
      VITE_NEW_RELIC_BROWSER_ACCOUNT_ID: ${NEW_RELIC_ACCOUNT_ID:-}
      VITE_NEW_RELIC_BROWSER_APP_ID: ${NEW_RELIC_BROWSER_LEADERBOARD_APP_ID:-}
      VITE_NEW_RELIC_BROWSER_LICENSE_KEY: ${NEW_RELIC_BROWSER_LICENSE_KEY:-}
      VITE_ENVIRONMENT: development
    networks:
      - beef-dev-network

  # ML Dashboard - Dev-only tool for exploring ML data
  ml-dashboard-backend:
    build:
      context: ..
      dockerfile: apps/ml-dashboard/backend/Dockerfile
    container_name: beef-ml-dashboard-backend-dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL_MODE: disable
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_ENABLED: "true"
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8052:8052"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - qdrant
    networks:
      - beef-dev-network
    restart: unless-stopped

  ml-dashboard-frontend:
    image: node:22-alpine
    container_name: beef-ml-dashboard-frontend-dev
    working_dir: /app
    volumes:
      - ../apps/ml-dashboard/frontend:/app
      - ml_dashboard_node_modules_dev:/app/node_modules
    ports:
      - "6175:6175"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8052
    networks:
      - beef-dev-network

volumes:
  postgres_data_dev:
  minio_data_dev:
  qdrant_data_dev:
  ml_models_cache_dev:
  deck_mini_app_node_modules_dev:
  leaderboard_mini_app_node_modules_dev:
  ml_dashboard_node_modules_dev:
  shared_mini_app_node_modules_dev:

networks:
  beef-dev-network:
    driver: bridge
