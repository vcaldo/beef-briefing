# Development environment - local machine
services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: beef-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      # To restore a backup on dev environment startup, run: make clean
      # then uncomment the line below and run: make up
      # - ../local_backups/db/latest.sql:/docker-entrypoint-initdb.d/99-restore.sql:ro
    networks:
      - beef-dev-network
    restart: unless-stopped

  api-service:
    build:
      context: ..
      dockerfile: apps/api-service/Dockerfile
    container_name: beef-api-service-dev
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL_MODE: disable
      API_PORT: ${API_PORT}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: telegram-media
      MINIO_USE_SSL: false
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      - postgres
      - minio
    networks:
      - beef-dev-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: beef-minio-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - beef-dev-network
    restart: unless-stopped

  telegram-bot:
    build:
      context: ..
      dockerfile: apps/telegram-bot/Dockerfile
    container_name: beef-telegram-bot-dev
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_SERVICE_URL: http://api-service:${API_PORT}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    depends_on:
      - api-service
    networks:
      - beef-dev-network
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    container_name: beef-dashboard-dev
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_SSL_MODE: disable
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8050}
      DASHBOARD_DOMAIN: localhost
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS}
      SESSION_LIFETIME_DAYS: ${SESSION_LIFETIME_DAYS:-7}
      FLASK_SECRET_KEY_FILE: /app/secrets/flask_secret_key
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}-dashboard-development
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    volumes:
      - ./secrets/apps/dashboard:/app/secrets:ro
    ports:
      - "${DASHBOARD_PORT:-8050}:${DASHBOARD_PORT:-8050}"
    depends_on:
      - postgres
    networks:
      - beef-dev-network
    restart: unless-stopped

volumes:
  postgres_data_dev:
  minio_data_dev:

networks:
  beef-dev-network:
    driver: bridge
